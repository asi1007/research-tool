[project]
name = "research-tool"
version = "0.4.1"
requires-python = ">=3.10"
dependencies = [
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
